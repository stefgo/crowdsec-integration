[pytest]
testpaths = tests
# The test modules put the component directory on the path themselves; without
# importmode=importlib, modules with the same name collide during collection.
addopts = -q --import-mode=importlib --cov=custom_components/crowdsec --cov-report=term-missing --cov-fail-under=90
# The Home-Assistant-dependent tests live in tests/ha and need a completely
# different environment (see requirements_test_ha.txt); they are collected by
# their own configuration in pytest_ha.ini.
norecursedirs = tests/ha
