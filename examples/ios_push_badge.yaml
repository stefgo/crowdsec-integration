# CrowdSec -> push notification and badge on iOS/iPadOS
#
# Include it as a Home Assistant package, e.g. as
# ``config/packages/crowdsec_push.yaml`` with the following entry in
# ``configuration.yaml``:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Adjust before use:
#   * ``mobile_app_iphone`` -> the real service of the companion app
#     (Developer tools -> Actions -> type "notify.")
#   * the entity IDs of the CrowdSec sensors, if the instance has another name
#
# The core of the burst resistance: there is *never* a push per ban. Every ban
# only lands in the buffer sensor, and a second automation sends a summarised
# message from it — either once 45 seconds of quiet have passed, immediately on
# a detected wave, or at the latest every five minutes.

notify:
  - platform: group
    name: crowdsec_mobile
    services:
      # One line per device. The name is the service without "notify.".
      - service: mobile_app_iphone

template:
  # Collects all bans between two pushes. The state is the number of reported
  # bans; the attributes hold IPs, scenarios and countries for the summary. A
  # "crowdsec_push_flush" event resets everything.
  - trigger:
      - trigger: event
        event_type: crowdsec_new_ban
        id: ban
      - trigger: event
        event_type: crowdsec_push_flush
        id: reset
      - trigger: homeassistant
        event: start
        id: reset
    sensor:
      - name: CrowdSec Ban Buffer
        unique_id: crowdsec_ban_buffer
        icon: mdi:shield-alert
        state: >-
          {% if trigger.id == 'ban' %}
            {{ (this.state | int(0)) + 1 }}
          {% else %}
            0
          {% endif %}
        attributes:
          ips: >-
            {% if trigger.id != 'ban' %}
              {{ [] }}
            {% else %}
              {{ ((this.attributes.get('ips', []) + [trigger.event.data.ip])
                   | reject('none') | unique | list)[-50:] }}
            {% endif %}
          scenarios: >-
            {% if trigger.id != 'ban' %}
              {{ [] }}
            {% else %}
              {{ ((this.attributes.get('scenarios', []) + [trigger.event.data.scenario])
                   | reject('none') | unique | list)[-20:] }}
            {% endif %}
          countries: >-
            {% if trigger.id != 'ban' %}
              {{ [] }}
            {% else %}
              {{ ((this.attributes.get('countries', []) + [trigger.event.data.country])
                   | reject('none') | unique | list)[-20:] }}
            {% endif %}
          last_ip: >-
            {{ trigger.event.data.ip if trigger.id == 'ban' else none }}
          last_scenario: >-
            {{ trigger.event.data.scenario if trigger.id == 'ban' else none }}

automation:
  # ---------------------------------------------------------------------
  # Digest push. Never fires more often than the buffer is emptied, condenses
  # any number of bans into one message and, thanks to "tag", replaces the
  # previous message on the lock screen instead of stacking up.
  # ---------------------------------------------------------------------
  - alias: "CrowdSec - digest push (iOS)"
    id: crowdsec_digest_push
    mode: single
    max_exceeded: silent
    triggers:
      # Normal case: no new ban for 45 seconds.
      - trigger: state
        entity_id: sensor.crowdsec_ban_buffer
        for: "00:00:45"
        id: quiet
      # Wave: so many bans that it should be reported right away.
      - trigger: numeric_state
        entity_id: sensor.crowdsec_ban_buffer
        above: 20
        id: wave
      # Safety net for continuous fire, where quiet never sets in.
      - trigger: time_pattern
        minutes: "/5"
        id: net
    conditions:
      - condition: numeric_state
        entity_id: sensor.crowdsec_ban_buffer
        above: 0
    variables:
      count: "{{ states('sensor.crowdsec_ban_buffer') | int(0) }}"
      ips: "{{ state_attr('sensor.crowdsec_ban_buffer', 'ips') or [] }}"
      scenarios: "{{ state_attr('sensor.crowdsec_ban_buffer', 'scenarios') or [] }}"
      countries: "{{ state_attr('sensor.crowdsec_ban_buffer', 'countries') or [] }}"
      wave: "{{ trigger.id == 'wave' or count >= 20 }}"
    actions:
      - action: notify.crowdsec_mobile
        data:
          title: >-
            {% if wave %}
              CrowdSec: attack wave ({{ count }} bans)
            {% elif count == 1 %}
              CrowdSec: new ban
            {% else %}
              CrowdSec: {{ count }} new bans
            {% endif %}
          message: >-
            {% if count == 1 %}
              {{ ips | first | default('?') }}
              {%- if countries %} ({{ countries | first }}){% endif %} -
              {{ scenarios | first | default('unknown scenario') }}
            {% else %}
              {{ ips | count }} IP{{ 's' if ips | count != 1 }}
              {%- if countries %} from {{ countries[:3] | join(', ') }}
                {%- if countries | count > 3 %} and others{% endif %}
              {%- endif %}.
              Scenarios: {{ scenarios[:3] | join(', ') | default('unknown', true) }}
              {%- if scenarios | count > 3 %} (+{{ scenarios | count - 3 }}){% endif %}
            {% endif %}
          data:
            # Same tag = the new message replaces the old one instead of piling
            # up into an unreadable stack during a burst.
            tag: crowdsec-digest
            group: crowdsec
            url: /config/integrations/integration/crowdsec
            push:
              badge: "{{ states('sensor.crowdsec_active_decisions') | int(0) }}"
              interruption-level: "{{ 'time-sensitive' if wave else 'active' }}"
              sound: default
      # Empty the buffer so the next message starts from zero again.
      - event: crowdsec_push_flush

  # ---------------------------------------------------------------------
  # Keep the badge up to date independently of the push. On iOS the badge is
  # an absolute value, so it is tied to the number of active decisions - that
  # way it stays correct when bans expire again.
  # The "for" throttles the silent pushes; iOS drops overly frequent ones
  # anyway.
  # ---------------------------------------------------------------------
  - alias: "CrowdSec - synchronise badge (iOS)"
    id: crowdsec_badge_sync
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.crowdsec_active_decisions
        for: "00:00:30"
      - trigger: homeassistant
        event: start
    conditions:
      # Do not fall back to 0 on "unavailable"/"unknown" while the LAPI is
      # temporarily unreachable.
      - condition: template
        value_template: >-
          {{ states('sensor.crowdsec_active_decisions')
             not in ['unknown', 'unavailable', 'none', ''] }}
    actions:
      - action: notify.crowdsec_mobile
        data:
          # Silent push without a visible message - only sets the badge.
          message: delete_alert
          data:
            push:
              badge: "{{ states('sensor.crowdsec_active_decisions') | int(0) }}"

  # ---------------------------------------------------------------------
  # Optional: clear the badge when the app has been opened. The companion app
  # reports that as a sensor "sensor.<device>_app_state" with value "active".
  # ---------------------------------------------------------------------
  # - alias: "CrowdSec - clear badge on open"
  #   id: crowdsec_badge_clear
  #   mode: single
  #   triggers:
  #     - trigger: state
  #       entity_id: sensor.iphone_app_state
  #       to: "active"
  #   actions:
  #     - action: notify.crowdsec_mobile
  #       data:
  #         message: delete_alert
  #         data:
  #           push:
  #             badge: 0
