[pytest]
# The Home-Assistant tests get their own configuration: pytest.ini next door is
# set up for the framework-free suite (importlib mode, coverage over the whole
# component) and neither setting fits here.
testpaths = tests/ha
# `tests/ha` is a package, so pytest puts `tests/` on the path and not the
# repository root — `custom_components` is then unimportable. It only worked
# locally because `python -m pytest` adds the working directory; CI calls the
# binary, which does not.
pythonpath = .
asyncio_mode = auto
addopts = -q
